apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hospital
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    rule_files:
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      - job_name: "aki-detection"
        static_configs:
          - targets: ["aki-detection:8000"]
            labels:
              group: "hospital"

    alerting:
      alertmanagers:
        - scheme: http
          static_configs:
            - targets:
                - "prom-ui.coursework6:9093"

  alert.rules.yml: |
    groups:
    - name: aki-custom-alerts
      rules:

      - alert: NoMessagesReceived
        expr: rate(messages_total[5m]) == 0
        for: 120m
        labels:
          severity: warning
          group: "hospital"
        annotations:
          summary: "No HL7 messages received in 2 hours"

      - alert: HighPagerFailures
        expr: increase(pager_requests_total{status_code!="200"}[5m]) > 2
        for: 5m
        labels:
          severity: critical
          group: "hospital"
        annotations:
          summary: "Pager failing frequently"

      - alert: HighMLLPReconnectRate
        expr: increase(mllp_reconnections_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          group: "hospital"
        annotations:
          summary: "MLLP reconnecting frequently"

      - alert: InferenceErrorsIncreasing
        expr: increase(inference_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          group: "hospital"
        annotations:
          summary: "Inference errors detected"