apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.49.1
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
        ports:
          - containerPort: 9090
        volumeMounts:
          - name: config
            mountPath: /etc/prometheus
        resources:
          requests:
            memory: 200Mi
            cpu: 200m
      volumes:
        - name: config
          configMap:
            name: prometheus-config